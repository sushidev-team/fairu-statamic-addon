name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd, exif
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-php-${{ matrix.php }}
          path: build/coverage
          if-no-files-found: ignore
